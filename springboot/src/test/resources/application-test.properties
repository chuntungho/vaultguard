# H2 in-memory for unit/integration tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=KEY
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
vaultguard.rsa-key-path=test-rsa-key.pem
vaultguard.admin-token=test-admin-token
spring.mail.host=localhost
spring.mail.port=1025
